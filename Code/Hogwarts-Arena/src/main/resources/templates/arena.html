<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Arena</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Inter:wght@400;600;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/home.css"> <!-- reuse base style -->
    <link rel="stylesheet" href="/css/arena.css"> <!-- arena overrides -->
</head>
<body>

<th:block th:insert="~{/fragments/index-fragments :: corner-veil}"></th:block>
<th:block th:insert="~{/fragments/index-fragments :: particles}"></th:block>
<div class="auth-blur"></div>
<main class="arena-shell">

    <h1 class="arena-title">Hogwarts Arena</h1>

    <div class="back-actions">
        <a href="/home" class="btn btn-secondary">Back to Home</a>
    </div>

    <!-- Gryffindor -->
    <section class="section panel">
        <header class="section-head">
            <h3>Gryffindor</h3>
            <span class="count-badge house-gryffindor" th:text="${#lists.size(gryffindorWizards)}">0</span>
        </header>
        <div class="cards wiz-cards">
            <article class="spell-card wiz-card" th:each="wiz : ${gryffindorWizards}">
                <div class="media">
                    <img th:src="${wiz.avatarUrl}">
                    <div class="pills">
                        <span class="pill" 
                              th:classappend="${wiz.alignment == T(main.model.WizardAlignment).LIGHT ? 'pill-align-light' : 'pill-align-dark'}"
                              th:text="${wiz.alignment.displayName}">Light</span>
                    </div>
                </div>
                <div class="body">
                    <h4 class="spell-name" th:text="${wiz.username}">Wanda</h4>
                    <div class="meta">
                        <span class="meta-item">Spells <strong th:text="${#lists.size(wiz.spells)}">5</strong></span>
                        <span class="meta-item">Power 
                            <strong th:text="${wiz.spells.stream().mapToInt(s -> s.getPower()).sum()}">312</strong>
                        </span>
                    </div>
                </div>
            </article>
            <p class="empty muted" th:if="${#lists.isEmpty(gryffindorWizards)}">No students yet.</p>
        </div>
    </section>
